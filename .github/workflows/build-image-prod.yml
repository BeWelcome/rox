name: Build production image

# Builds and publishes versioned production images when a release tag (v*) is pushed.
# This workflow fires after feature/docker-master is merged to master and a maintainer
# creates a release tag (e.g. git tag v3.7.0 && git push origin v3.7.0).
#
# Triggered by: push of a v* git tag (e.g. v3.7.0)
# Deploys to:   prod — manually via the "Deploy prod" workflow in sysadmins-infra
#               (this workflow does NOT auto-deploy; it only publishes the images)
#
# Images published per release tag:
#   ghcr.io/bewelcome/rox:3.7.0         — PHP-FPM (full semver)
#   ghcr.io/bewelcome/rox:3.7           — PHP-FPM (major.minor)
#   ghcr.io/bewelcome/rox:latest        — PHP-FPM (rolling latest)
#   ghcr.io/bewelcome/rox:3.7.0-web    — Nginx (full semver)
#   ghcr.io/bewelcome/rox:3.7-web      — Nginx (major.minor)
#   ghcr.io/bewelcome/rox:latest-web   — Nginx (rolling latest)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v3.7.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: read

env:
  IMAGE: ghcr.io/bewelcome/rox

concurrency:
  group: build-image-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.prefix }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, platform: linux/amd64,  runner: ubuntu-latest,      target: bewelcome_php,   prefix: php}
          - {arch: arm64, platform: linux/arm64,  runner: ubuntu-24.04-arm,   target: bewelcome_php,   prefix: php}
          - {arch: amd64, platform: linux/amd64,  runner: ubuntu-latest,      target: bewelcome_nginx, prefix: nginx}
          - {arch: arm64, platform: linux/arm64,  runner: ubuntu-24.04-arm,   target: bewelcome_nginx, prefix: nginx}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # tag=v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Compute version metadata
        id: version
        run: |
          echo "revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git log -n 1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # tag=v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # tag=v5.6.1
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5  # tag=v3.8.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75  # tag=v6.9.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.revision }}
            APP_VERSION_TIMESTAMP=${{ steps.version.outputs.timestamp }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod-${{ matrix.prefix }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.prefix }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # tag=v4.6.2
        with:
          name: digests-${{ matrix.prefix }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-php:
    name: Push PHP manifest
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Download PHP digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # tag=v4.1.8
        with:
          path: /tmp/digests
          pattern: digests-php-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # tag=v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5  # tag=v3.8.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # tag=v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Capture version info
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  merge-nginx:
    name: Push Nginx manifest
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download Nginx digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # tag=v4.1.8
        with:
          path: /tmp/digests
          pattern: digests-nginx-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # tag=v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5  # tag=v3.8.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # tag=v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},suffix=-web
            type=semver,pattern={{major}}.{{minor}},suffix=-web
            type=raw,value=latest-web

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  scan:
    name: Scan image
    runs-on: ubuntu-latest
    needs: [merge-php]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # tag=v4.1.7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # tag=v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # tag=v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: '1'
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.merge-php.outputs.version }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          version: v0.74.0

  create-github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [merge-php, merge-nginx, scan]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # tag=v4.2.2
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.merge-php.outputs.version }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "BeWelcome ${{ github.ref_name }}" \
            --generate-notes \
            --notes-start-tag "$(git tag --sort=-version:refname | sed -n '2p')" \
            --verify-tag
