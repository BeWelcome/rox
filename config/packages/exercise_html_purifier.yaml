exercise_html_purifier:
    default_cache_serializer_path: '%kernel.cache_dir%/htmlpurifier'

    html_profiles:
        default:
            config:
                # the charset used by the original contents
                Core.Encoding: 'UTF-8'
                # full configuration reference: http://htmlpurifier.org/live/configdoc/plain.html
        # Wiki pages: the wiki markup's HTML without scripts, event handlers and the like; ids stay for the
        # headings the table of contents links to; links to other sites open in a new tab, without passing rank
        wiki:
            config:
                Core.Encoding: 'UTF-8'
                Attr.EnableID: true
                HTML.TargetBlank: true
                HTML.Nofollow: true
        # Plain text such as titles: no markup at all
        text:
            config:
                Core.Encoding: 'UTF-8'
                HTML.Allowed: ''
        # Community news: the custom profile with headings (the news editor's toolbar)
        news:
            config:
                Core.Encoding: 'UTF-8'
                HTML.Allowed: 'p,b,a[href],br,i,u,strong,em,h2,h3,ol,ul,li,img[src|alt|width|height],blockquote,hr,figure[class],figcaption'
                HTML.TargetBlank: true
                AutoFormat.RemoveEmpty: true
            elements:
                figure:
                    - Block
                    - Flow
                    - Common
                    - src: URI
                      class: Text
                figcaption:
                    - Block
                    - Flow
                    - Common
        custom:
            config:
                Core.Encoding: 'UTF-8'
                HTML.Allowed: 'p,b,a[href],br,i,u,strong,em,ol,ul,li,dl,dt,dd,img[src|alt|width|height],blockquote,del,figure[class],figcaption'
                HTML.TargetBlank: true
                AutoFormat.RemoveEmpty: true
                AutoFormat.AutoParagraph: true
                AutoFormat.Linkify: true
            elements:
                figure:
                    - Block
                    - Flow
                    - Common
                    # The 4th and 5th arguments are optional
                    - src: URI # list of type rules by attributes
                      class: Text
                figcaption:
                    - Block
                    - Flow
                    - Common
