monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    # Production logs go to stderr (docker logs, shipped to VictoriaLogs). The records of a request are buffered and
    # only written when it logs an error, so normal requests produce no lines. Warnings are written as they happen.
    # Deprecations are off unless DEPRECATION_LOG is set (e.g. php://stderr on stage); it's read at runtime, so a
    # container restart picks a change up.
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            # Only the warning level, without a buffer: warnings often point at a problem before it becomes an error.
            # Errors stay with "main", so they aren't written twice.
            warnings:
                type: filter
                handler: warnings_stream
                min_level: warning
                max_level: warning
                channels: ["!deprecation"]
            warnings_stream:
                type: stream
                path: php://stderr
                formatter: monolog.formatter.json
                nested: true
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!deprecation"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: '%env(DEPRECATION_LOG)%'
                formatter: monolog.formatter.json

    parameters:
        env(DEPRECATION_LOG): /dev/null
