apc.enable_cli = 1
date.timezone = Europe/Berlin
memory_limit = 512M
session.auto_start = Off
short_open_tag = Off

; Upload limits, same as Lion. The gallery and avatar forms read
; upload_max_filesize at runtime. Keep nginx client_max_body_size above
; post_max_size (docker/nginx/conf.d/default.conf).
upload_max_filesize = 8M
post_max_size = 9M

# https://symfony.com/doc/current/performance.html
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.validate_timestamps = 0
opcache.preload = /srv/bewelcome/var/cache/prod/App_KernelProdContainer.preload.php
opcache.preload_user = www-data
realpath_cache_size = 4096K
realpath_cache_ttl = 600
