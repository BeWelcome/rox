apc.enable_cli = 1
date.timezone = Europe/Berlin
memory_limit = 512M
session.auto_start = Off
short_open_tag = Off

; Upload limits, same as Lion. The gallery and avatar forms read
; upload_max_filesize at runtime. Keep nginx client_max_body_size above
; post_max_size (docker/nginx/conf.d/default.conf).
upload_max_filesize = 8M
post_max_size = 9M

# https://symfony.com/doc/current/performance.html
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Translation saves and new mailings rebuild the translation catalogues (about 70 MB of PHP);
; 512 MB keeps OPcache from running out and restarting on every rebuild (#594).
opcache.memory_consumption = 512
opcache.validate_timestamps = 0
; No opcache.preload: an OPcache restart with preloaded classes makes every request in that
; moment fail with "Cannot declare class ComposerAutoloaderInit..." (#594). Without preloading
; a restart only recompiles scripts.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
