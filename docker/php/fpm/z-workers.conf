; PHP-FPM worker pool tuning for bewelcome beta/staging
;
; Baseline: ~104 MB RSS per worker on the alpha-stage server (16 GB RAM).
; At 25 workers that's ~2.6 GB reserved for PHP, leaving plenty for
; MariaDB, Manticore, and the OS on the same host.
;
; Adjust pm.max_children upward on hosts with more available RAM.
; Rule of thumb: floor((available_RAM_MB - 4096) / 110)

[www]
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500
