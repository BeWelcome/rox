App\Entity\Activity:
    activity_hiking_trip:
        createdBy: '@member_1'
        starts: '<dateTimeBetween("+1 days", "+10 days")>'
        ends: '<dateTimeBetween("+11 days", "+15 days")>'
        location: '@NewBerlin'
        address: '<address()>'
        title: 'Weekend hiking trip around Berlin'
        description: '<paragraph(3)>'
        status: 0
        online: 0
    activity_city_walk:
        createdBy: '@member_2'
        starts: '<dateTimeBetween("+2 days", "+20 days")>'
        ends: '<dateTimeBetween("+20 days", "+21 days")>'
        location: '@NewJayapura'
        address: '<address()>'
        title: 'Guided city walk and local food tasting'
        description: '<paragraph(3)>'
        status: 0
        online: 0
    activity_language_cafe:
        createdBy: '@member_3'
        starts: '<dateTimeBetween("-10 days", "-1 days")>'
        ends: '<dateTimeBetween("-1 days", "now")>'
        location: '@NewBerlin'
        address: '<address()>'
        title: 'Language exchange cafe meetup'
        description: '<paragraph(3)>'
        status: 0
        online: 1

App\Entity\ActivityAttendee:
    attendee_hiking_organizer:
        __construct:
            - '@activity_hiking_trip'
            - '@member_1'
            - 1
            - 'Looking forward to it, bring good shoes!'
            - true
    attendee_hiking_{2..5}:
        __construct:
            - '@activity_hiking_trip'
            - '@member_<current()>'
            - '<numberBetween(1, 3)>'
            - '<sentence()>'
            - false
    attendee_city_walk_organizer:
        __construct:
            - '@activity_city_walk'
            - '@member_2'
            - 1
            - 'See you all there!'
            - true
    attendee_city_walk_{6..10}:
        __construct:
            - '@activity_city_walk'
            - '@member_<current()>'
            - '<numberBetween(1, 3)>'
            - '<sentence()>'
            - false
