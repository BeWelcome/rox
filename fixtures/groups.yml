App\Entity\Group:
    group_hiking:
        name: 'Hiking Enthusiasts'
        type: 'Public'
        picture: ''
        membersOnly: false
        approved: 1
    group_language_exchange:
        name: 'Language Exchange'
        type: 'Public'
        picture: ''
        membersOnly: false
        approved: 1
    group_vegan_travelers:
        name: 'Vegan Travelers'
        type: 'NeedAcceptance'
        picture: ''
        membersOnly: true
        approved: 1

App\Entity\GroupMembership:
    membership_hiking_{1..5}:
        member: '@member_<current()>'
        group: '@group_hiking'
        status: 'In'
        comment: '<sentence()>'
    membership_language_{1..5}:
        member: '@member_<current()>'
        group: '@group_language_exchange'
        status: 'In'
    membership_vegan_{6..10}:
        member: '@member_<current()>'
        group: '@group_vegan_travelers'
        status: '<randomElement(["In", "WantToBeIn"])>'
