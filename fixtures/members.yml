App\Entity\Member:
    bwadmin:
        Username: 'bwadmin'
        BirthDate: <dateTime('1970-01-01')>
        Email: <email()>
        Status: 'Active'
        RemindersWithoutLogin: 0
        HideAttribute: 0
        Name: 'BeWelcome Admin'
        ShortName: 'BWAdmin'
        Gender: 'other'
        Accommodation: 'no'
    member_{1..5}:
        Username: 'member-<current()>'
        BirthDate: <dateTimeBetween('-80years', '-18years')>
        Email: 'member-<current()>\@bewelcome.org'
        Status: '<randomElement(["Active", "OutOfRemind"])>'
        HideAttribute: <numberBetween(0, 31)>
        Gender: '<randomElement(["female", "male", "other"])>'
        Accommodation: '<randomElement(["yes", "no"])>'
        hostingInterest: '<numberBetween(1,10)>'
        AboutMe: '<paragraph(3)>'
        Occupation: '<jobTitle()>'
        Hobbies: '<words(4, true)>'
        Books: '<words(3, true)>'
        Music: '<words(3, true)>'
        Movies: '<words(3, true)>'
        PleaseBring: '<sentence()>'
        WhereYouSleep: '<sentence()>'
        OfferGuests: '<sentence()>'
        OfferHosts: '<sentence()>'
        GettingThere: '<sentence()>'
        ILiveWith: '<sentence(6)>'
        PastTrips: '<sentence(10)>'
        PlannedTrips: '<sentence(8)>'
        Organizations: '<company()>'
        AdditionalAccommodationInfo: '<sentence()>'
        HouseRules: '<sentence()>'
        MaxLengthOfStay: '<randomElement(["1 night", "2-3 nights", "1 week", "flexible"])>'
