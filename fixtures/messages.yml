        departure: <dateTimeBetween('+4 days', '+4 days')>
        flexible: false
        numberOfTravellers: 1
        status: 2
    request_tentative:
        arrival: <dateTimeBetween('+20 days', '+20 days')>
        departure: <dateTimeBetween('+22 days', '+22 days')>
