# Messages, hosting requests and invitations.
#
# Read messages have a firstRead date, unread ones have firstRead null.
# Spam messages live in the 'Spam' folder:
#   - SpamSayMember + ToCheck: reported by the receiver, waiting in the checker queue
#   - SpamBlkWord + ToCheck:   caught by the blocked word filter
#   - SpamSayChecker + Checked: confirmed by a checker
# Requests are messages with a HostingRequest. Invitations are requests whose
# HostingRequest points to a trip leg (inviteForLeg), sent by the host to the traveller.
#
# created is the date the message was sent. App\Processor\Fixtures\MessageProcessor writes it
# back after loading, because Message::onPrePersist sets it to now.

