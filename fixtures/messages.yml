        message: '<paragraph(2)>'
        status: 'Sent'
        folder: 'Normal'
        spamInfo: 'NotSpam'
        deleteRequest: ''
        checkerComment: null

    # Conversation between member-1 and member-2, last reply unread
    message_conversation_1_1 (extends message_base):
        sender: '@member_1'
        receiver: '@member_2'
        initiator: '@member_1'
        subject: '@subject_conversation_1'
        created: <dateTimeBetween('-12 days', '-12 days')>
        firstRead: <dateTimeBetween('-11 days', '-11 days')>
    message_conversation_1_2 (extends message_base):
        sender: '@member_2'
        receiver: '@member_1'
        initiator: '@member_1'
