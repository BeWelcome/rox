  - 'New members: the label of the text of the standard greeting.'
admin.newmembers.dialog.greeting.default:
  - "Hi {username},\n\nwelcome to BeWelcome! I'm a volunteer from the welcome team.\n\nMembers find hosts and guests much more easily when they can see who you are. Adding a photo and a few lines about yourself on your profile makes a big difference.\n\nIf you have questions, just reply to this message.\n\nHappy travels,\n{volunteer}"
  - 'New members: the default text of the standard greeting, which the volunteer can change before sending. Keep {username} (each member''s username, filled in when the greeting is sent) and {volunteer} (the volunteer''s username). Avoid e-mail addresses and the words support, system and verification: messages with them are held as spam.'
admin.newmembers.dialog.greeting.hint:
  - '{username} becomes each member''s username.'
  - 'New members: the hint under the text of the standard greeting. Keep {username}.'
admin.newmembers.dialog.info:
  - 'Each member gets this as their own message from you, so nobody sees who else got it and replies come back to you one by one. The greeting is marked as sent for all of them.'
  - 'New members: the explanation in the standard greeting dialog.'
