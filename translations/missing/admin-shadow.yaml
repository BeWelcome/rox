  - 'The pattern {pattern} was added.'
  - 'Notice after adding a pattern. Keep {pattern} as it is.'
admin.shadow.patterns.none:
  - 'No sign-up pattern yet.'
  - 'Sign-up patterns: the empty list.'
admin.shadow.pattern.off:
