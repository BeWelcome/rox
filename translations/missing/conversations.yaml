unread.only:
    - Unread only
    - Switch label on the conversations page
conversations.none:
    - No conversations found.
    - Shown on the dashboard
conversations.check.all:
    - Select all
    - Checkbox label on /conversations
conversations.uncheck.all:
    - Deselect all
    - Checkbox label on /conversations
conversations.label.delete_or_spam:
    - Delete or mark messages as spam
    - Aria label (for screen reader user)
conversations.request:
    - Hosting Request
    - Text label used in conversations
conversations.invitation:
    - Invitation to stay
    - Text label used in conversations
message.initiated.by:
    - Initiated by {username}
    - Distinction used on the conversations pages
lives.and.speaks:
    - Lives in {city} and speaks {languages}
    - Part of the header on a new message to let member know some details about the member
flash.marked.deleted:
    - 'The conversations have been marked as deleted.'
    - Flash message shown when the user marks one or more conversation as deleted.
flash.marked.purged:
    - 'The conversations have been marked as purged (irrevocably deleted).'
    - Flash message shown when the user marks one or more conversation as purged.
flash.recovered:
    - 'The conversations have been recovered and moved back in the regular folders.'
    - Flash message shown when the user decided to move deleted conversations back.
conversation.with:
    - 'Conversation with {username}'
    - Subject used when the message is older than the introduction of subjects
contact.not.without.profile.picture:
    - 'To contact {username} you need to add a profile picture.'
    - Flash shown when trying to send a request to a member that has the preference "Allow requests without profile picture to 'No'"
contact.not.without.about_me:
    - 'To contact {username} you need to fill out the About Me section of your profile.'
    - Flash shown when trying to send a request to a member that has the preference "Allow requests without about me to 'No'"

conversation.reply.templates:
    - Templates
    - Button label for the reply template dropdown on conversation reply forms
conversation.reply.template.interested.label:
    - "I'm interested"
    - Label for a conversation reply template
conversation.reply.template.interested.body:
    - '<p>Thanks for your message. This sounds good to me. I will get back to you with the details soon.</p>'
    - Body for a conversation reply template
conversation.reply.template.need_details.label:
    - 'I need more details'
    - Label for a conversation reply template
conversation.reply.template.need_details.body:
    - '<p>Thanks for your message. Could you send me a little more information before I confirm?</p>'
    - Body for a conversation reply template
conversation.reply.template.not_available.label:
    - "I'm not available"
    - Label for a conversation reply template
conversation.reply.template.not_available.body:
    - '<p>Thanks for your message. Unfortunately this will not work for me this time. I hope you find another option.</p>'
    - Body for a conversation reply template
conversations.select.done:
    - Done
    - Button on the conversations list that leaves the selection mode (it replaces "Select")
conversations.pick:
    - Pick a conversation to read it.
    - Shown on the right of the conversations list on large screens when no conversation is open
conversation.reply.to:
    - Reply to {username}…
    - Placeholder of the reply box at the bottom of a conversation
contact.sent.message.title:
    - 'Your message is on its way'
    - Title of the confirmation shown in the search preview once a message has been sent
contact.sent.message.text:
    - '{username} gets it in their messages and by email. Their answer will show up in your messages.'
    - Text under the title of the confirmation once a message has been sent from the search preview
contact.sent.request.title:
    - 'Your request has been sent'
    - Title of the confirmation shown in the search preview once a stay request has been sent
contact.sent.request.text:
    - '{username} gets it in their messages and by email. You will be told as soon as they answer.'
    - Text under the title of the confirmation once a stay request has been sent from the search preview
contact.sent.back:
    - 'Back to the search'
    - Button of the confirmation shown in the search preview after sending a message or request; closes the panel
contact.sent.conversation:
    - 'See the conversation'
    - Link of the confirmation shown in the search preview after sending a message or request; opens the conversation
contact.sent.back.profile:
    - 'Back to the profile'
    - Button of the confirmation shown on a profile page after sending a message or request from the side panel; closes the panel
