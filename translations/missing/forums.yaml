forum.thread:
    - 'Thread: '
    - Label for the thread link on the search result pages.
forum.group:
    - 'Group: '
    - Label for the group link on the search result pages.
forum.read.more:
    - '@comment.read.more'
forum.show.less:
    - '@comment.show.less'
forum.post.subscribe:
    - 'Notify me about replies'
    - Checkbox below a new forum thread or reply; subscribes the member to the thread
forum.subscription.subscribed:
    - 'You will get a mail about new replies.'
    - Message after a member subscribed to a forum thread
forum.subscription.unsubscribed:
    - 'You won''t get mails about this thread any more.'
    - Message after a member unsubscribed from a forum thread
forum.subscription.paused:
    - 'The notifications of this thread are off.'
    - Message after a member switched off the notifications of a thread they subscribed to
forum.subscription.group.off:
    - 'You won''t get mails about this group''s forum any more.'
    - Message after a member switched off the forum notifications of a group they are in
forum.agora.welcome.notice:
    - 'New members get the posts of the BeWelcome forum by mail.'
    - Shown once, in the first forum notification a new member gets about the BeWelcome forum; followed by forum.agora.welcome.unsubscribe as a link
forum.agora.welcome.unsubscribe:
    - 'Stop these mails with one click.'
    - The link in forum.agora.welcome.notice; switches off the BeWelcome forum's notifications without logging in
forum.agora.notifications.off:
    - 'You won''t get mails about the BeWelcome forum any more. You can switch them on again in your forum subscriptions.'
    - Page after a member clicked the link in forum.agora.welcome.notice
forum.moderation.owner.can.edit:
    - 'Author can still edit it'
    - Switch in the forum moderators' panel of a post
forum.moderation.save.thread:
    - 'Save topic'
    - Button of the Topic part of the forum moderators' panel
forum.moderation.save.post:
    - 'Save post'
    - Button of the This post part of the forum moderators' panel
forum.moderation.saved:
    - 'Saved'
    - Next to the button after a forum moderator saved a post, a topic or a report
forum.report.comment:
    - 'Your message to the moderators'
    - Field when a member reports a forum post to the moderators, or a moderator answers
forum.report.send:
    - 'Send'
    - Button when a member reports a forum post to the moderators, or a moderator answers
forum.report.sent:
    - 'The moderators got your message.'
    - Message after a member reported a forum post to the moderators
forum.report.status:
    - 'Status'
    - Status of a member's report about a forum post
forum.report.status.open:
    - 'Open'
    - Status of a report about a forum post that no moderator has handled yet
forum.report.status.discussion:
    - 'In discussion'
    - Status of a report about a forum post the moderators discuss
forum.report.status.closed:
    - 'Closed'
    - Status of a report about a forum post that is handled
forum.reports.title:
    - 'Reports to the moderators'
    - Title of the forum moderators' reports pages
forum.reports.none:
    - 'No reports to answer.'
    - Reports tab when the list is empty
forum.search.term:
    - 'Search words'
    - Placeholder of the forum search field (forum overview, a group's forum, a member's forum posts)
forum.thread.all.discussions:
    - 'All discussions'
    - Forum thread page, link above the title back to the list of the group's discussions
forum.thread.posts:
    - '{count, plural, one {# post} other {# posts}}'
    - Forum thread page, under the buttons, how many posts the thread has (5 posts)
forum.thread.last.reply:
    - 'last reply {date}'
    - Forum thread page, after the number of posts, the day of the last post (last reply Oct 17)
forum.thread.write.reply:
    - 'Write a reply'
    - Forum thread page, button under the posts; opens the reply in a side panel
forum.post.author:
    - 'Author'
    - Forum thread page, tag next to the name on the posts of the member who started the thread
forum.post.you:
    - 'You'
    - Forum thread page, tag next to the name on the member's own posts
forum.post.group.only:
    - 'Group only'
    - Forum thread page, next to the day of a post only the group's members can see
forum.reply.to:
    - 'Reply to'
    - Side panel to reply to a forum thread, small line above the thread's title
forum.reply.placeholder:
    - 'Write your reply...'
    - Side panel to reply to a forum thread, grey text in the empty editor
forum.reply.who.can.see:
    - 'Who can see it'
    - Side panel to reply to a forum thread, title above the choice of who can see the reply
forum.reply.post:
    - 'Post reply'
    - Side panel to reply to a forum thread, the button that sends the reply
forum.thread.subscribed:
    - 'Subscribed'
    - Forum thread page, the bell button when the member gets mails about new posts; a click unsubscribes
forum.thread.order.latest:
    - 'Latest first'
    - Forum thread page, link that shows the newest posts first
forum.thread.order.oldest:
    - 'Oldest first'
    - Forum thread page, link that shows the oldest posts first
forum.post.started:
    - 'Started the topic'
    - Forum thread, tag next to the name on the first post
forum.thread.discussions:
    - 'Discussions'
    - Forum thread, at the top after the group's name, link to the group's discussions
forum.thread.people:
    - '{count, plural, one {# person in this topic} other {# people in this topic}}'
    - Forum thread, side card, above the photos of the members who wrote in the thread
forum.thread.sort:
    - 'Sort'
    - Forum thread, side card, above Oldest first / Latest first
forum.thread.replies:
    - '{count, plural, =0 {No replies yet} one {# reply} other {# replies}}'
    - Forum thread, under the first post, next to Reply
forum.thread.write.placeholder:
    - 'Write a reply…'
    - Forum thread, grey text in the field at the bottom that opens the reply panel
forum.former.member:
    - 'Former member'
    - Forum, instead of the name on posts of members who aren't on BeWelcome any more
forum.rules.in.short:
    - 'Forum rules in short'
    - Heading of the short rules next to the form for a new topic
forum.rules.read.all:
    - 'Read all rules'
    - Link from the short rules (new topic) to the Rules tab of the group
forum.post.topic:
    - 'Post topic'
    - Button that sends the form for a new topic
forum.rules.before.reply:
    - '<b>Before you reply:</b> be kind, stay on topic, no advertising or personal details of others.'
    - Strip above the reply box of a forum thread; keep the <b></b>
forum.rules.all:
    - 'All rules'
    - Link in the strip above the reply box to the Rules tab of the group
forum.moderation.not.saved:
    - 'Not saved: please check the fields and try again.'
    - Message when a forum moderator's changes to a post or topic could not be saved
forum.moderation.title:
    - 'Moderation'
    - Heading of the forum moderators' panel on a topic
forum.moderation.this.post:
    - 'This post'
    - Forum moderators' panel, the part about the chosen post
forum.moderation.topic:
    - 'Topic'
    - Forum moderators' panel, the part about the whole topic
forum.moderation.moderate:
    - 'Moderate'
    - Button in the side card of a topic for forum moderators; opens the moderation panel
forum.moderation.post.moderate:
    - 'Moderate this post'
    - Shield button on a post, and button on a report; opens the moderation panel on the post
forum.moderation.topic.moderate:
    - 'Moderate this topic'
    - Shield button on a topic in a group's discussions, for forum moderators
forum.moderation.post.visibility:
    - 'Who can see this post'
    - Field in the forum moderators' panel of a post
forum.moderation.topic.visibility:
    - 'Who can see this topic'
    - Field in the forum moderators' panel of a topic
forum.moderation.deleted:
    - 'Deleted (only moderators see it)'
    - Switch in the forum moderators' panel of a post or topic
forum.moderation.group.help:
    - 'Moves the topic with all its posts.'
    - Help under the group field of the forum moderators' panel of a topic
forum.moderation.pin:
    - 'Pin'
    - 'Field in the forum moderators'' panel of a topic: a number, 0 is not pinned'
forum.moderation.hide.after:
    - 'Hide after'
    - 'Field in the forum moderators'' panel of a topic: the day after which the topic is hidden'
forum.moderation.pin.help:
    - '0 is not pinned; higher numbers stay above lower ones.'
    - Help under Pin in the forum moderators' panel of a topic
forum.moderation.edit:
    - 'Edit'
    - Link in the forum moderators' panel of a post; edits the post's text
forum.moderation.translate:
    - 'Translate'
    - Link in the forum moderators' panel of a post; translates the post
forum.moderation.reports.of.post:
    - 'Reports about this post'
    - Forum moderators' panel of a post, small heading above the reports about it
forum.moderation.hint:
    - 'You also see hidden and deleted topics.'
    - A group's discussions, line for forum moderators above the topics
forum.moderation.filter:
    - 'Show topics'
    - A group's discussions, label of the forum moderators' filter (for screen readers)
forum.moderation.filter.all:
    - 'All'
    - 'A group''s discussions, forum moderators'' filter: all topics'
forum.moderation.filter.reported:
    - 'Reported'
    - 'A group''s discussions, forum moderators'' filter: topics with open reports'
forum.moderation.filter.hidden:
    - 'Hidden or deleted'
    - 'A group''s discussions, forum moderators'' filter: topics not every member sees'
forum.moderation.open.reports:
    - '{count, plural, one {# open report} other {# open reports}}'
    - Tag on a topic for forum moderators; a link to the reports
forum.moderation.pinned:
    - 'Pinned · {value}'
    - Tag on a topic for forum moderators; value is the pin number
forum.moderation.hidden.after:
    - 'Hidden after {date}'
    - Tag on a topic for forum moderators
forum.moderation.deleted.tag:
    - 'Deleted'
    - Tag on a deleted topic or post, for forum moderators
forum.moderation.edit.locked:
    - 'Editing locked'
    - Tag on a post for forum moderators when its author can't edit it any more
forum.moderation.reported.by:
    - 'Reported by'
    - Under a reported post, for forum moderators, before the names of the members who reported it
forum.moderation.waiting:
    - 'Waiting for a moderator'
    - Hint on the orange dot of a report the member wrote last in
forum.moderation.not.answered:
    - 'Nobody has answered yet'
    - State of a report no moderator answered
forum.moderation.wrote.again:
    - '{reporter} wrote again'
    - State of a report the member added to after a moderator's answer
forum.moderation.answered.by:
    - 'Answered by {moderator}'
    - State of a report a moderator answered last
forum.moderation.closed.by:
    - 'Closed by {moderator}'
    - State of a closed report
forum.moderation.moderator.name:
    - '{name} · moderator'
    - Name above a moderator's message in a report
forum.moderation.notice.deleted:
    - 'This topic is deleted. Only moderators see it.'
    - Notice above the posts of a deleted topic
forum.moderation.notice.moderators:
    - 'Only moderators see this topic.'
    - Notice above the posts of a topic only moderators see
forum.moderation.notice.group:
    - 'Only group members see this topic.'
    - Notice above the posts of a topic only the group's members see
forum.reports.tab:
    - 'Reports'
    - 'Tab of every group for forum moderators: the reports about posts'
forum.reports.list.open:
    - 'Open'
    - Reports tab, list of all open reports
forum.reports.list.mine.open:
    - 'Mine, open'
    - Reports tab, list of the open reports the moderator answered
forum.reports.list.mine:
    - 'All mine'
    - Reports tab, list of all reports the moderator answered
forum.reports.scope:
    - 'Groups'
    - Reports tab, label of the choice This group / All groups (for screen readers)
forum.reports.scope.group:
    - 'This group'
    - Reports tab, reports about posts of this group
forum.reports.scope.all:
    - 'All groups'
    - Reports tab, reports about posts of all groups
forum.reports.reported.post.by:
    - 'reported a post by'
    - 'Reports tab, between the names: "anna reported a post by tom"'
forum.reports.report.by:
    - 'Report by'
    - A report, small line above the name of the member who sent it
forum.reports.answer.placeholder:
    - 'Answer {reporter} (optional)'
    - A report, grey text in the moderator's answer field
forum.reports.save.status:
    - 'Save status'
    - 'A report, the button when the answer is empty: only the status changes'
forum.reports.reported.post:
    - 'Reported post'
    - A report, heading of the side card with the post
forum.reports.see.in.topic:
    - 'See it in the topic'
    - A report, link to the post in its topic
forum.reports.other.reports:
    - 'Other reports about it'
    - A report, heading of the other members' reports about the same post
forum.report.title:
    - 'Report to moderators'
    - Title of the page where a member reports a forum post
forum.report.back:
    - 'Back to the topic'
    - Link on the page where a member reports a forum post
forum.report.whats.wrong:
    - 'What''s wrong with this post?'
    - Field label when a member reports a forum post
forum.report.add:
    - 'Add to your report'
    - Field label when a member already reported the post
forum.report.send.button:
    - 'Send report'
    - Button when a member reports a forum post
forum.report.add.button:
    - 'Add'
    - Button when a member adds to their report
forum.report.yours:
    - 'Your report'
    - Heading above the messages of a member's report
forum.report.answer.hint:
    - 'A moderator will answer here. We''ll let you know by message.'
    - Under the messages of a member's report
forum.report.who.reads:
    - 'Who reads this'
    - Heading of the box next to the report form
forum.report.who.reads.text:
    - 'Only the forum moderators see your report. {author} doesn''t know who reported the post.'
    - Box next to the report form; author is the post's author
forum.report.moderators.can:
    - 'Moderators can hide or delete posts that break the group''s rules.'
    - Box next to the report form
forum.report.read.rules:
    - 'Read the rules'
    - Link in the box next to the report form, to the group's rules
