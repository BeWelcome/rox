album:
    - 'Album: '
    - Shown on the gallery manage page in front of the album title.
upload.error.no_image:
    - 'Unknown file'
    - Error shown to the user, when an error happens during image upload and the server can't return the filename
upload.error.too_large:
    - 'Uploaded file too large'
    - Error shown, when the filename of the uploaded file isn't known as that is the most likeliest reason
gallery.no.albums:
    - This user has not created any albums yet.
    - Shown if there are no albums.
gallery.no.latest.images:
    - This user hasn\'t uploaded any images yet.
    - Shown if there are no images uploaded by the user.
gallery.upload.type.error:
    - The file type is not supported.
    - Shown as a note to the user when they try to upload a file that isn't an image on the gallery upload page.
gallery.upload.size.error:
    - The file is too large to be uploaded to the server.
    - Shown as a note to the user when they try to upload a too large file on the gallery upload page.
gallery.upload.successful:
    - Image uploaded successfully.
    - Shown to the user when a file was successfully transferred to the server.
gallery.select.all:
    - 'Select all'
    - Label for the checkbox on manage gallery page
gallery.move.not.possible:
    - Can't move without target. Neither album selected nor new name provided.
    - Error message shown if someone tries to move images but did not select any of the radiobutton options
gallery.no.album.selected:
    - 'No album selected.'
    - Error message shown if someone tries to move images and did not select an album (but selected the radiobutton to move into album)
gallery.no.album.given:
    - 'No name for album given.'
    - Error message shown if someone tries to move images and did not give an album name (but selected the radiobutton for new album)
gallery.no.images.selected:
    - 'You need to select at least one image.'
    - Error message shown if someone tries to move or delete images but didn't select any
gallery.create.new.album:
    - '@GalleryCreateNewPhotoset'
gallery.use.existing.album:
    - '@GalleryAddToPhotoset'
gallery.manage.empty.title:
    - 'No photos yet'
    - Shown as the title of the empty state on the gallery manage page when the member has not uploaded any photo.
gallery.manage.empty.text:
    - 'Share your travels and memories with the community by uploading your first photos.'
    - Shown as the description in the empty state on the gallery manage page, inviting the member to upload their first photos.
gallery.manage.photo.count.one:
    - '%d photo'
    - Shown next to the page title on the gallery manage page when the member has exactly one photo. The %d placeholder is the photo count.
gallery.manage.photo.count.many:
    - '%d photos'
    - Shown next to the page title on the gallery manage page when the member has more than one photo. The %d placeholder is the photo count.
gallery.upload.dropzone.title:
    - 'Drop your photos here'
    - Title of the drag-and-drop area on the gallery upload page, inviting the member to drag image files.
gallery.upload.dropzone.subtitle:
    - 'or click to browse from your computer'
    - Subtitle below the drag-and-drop area on the gallery upload page, indicating the area can also be clicked to open the file picker.
gallery.upload.queue.title:
    - 'Upload queue'
    - Heading shown above the list of files being uploaded on the gallery upload page.
gallery.upload.back.to.gallery:
    - 'Back to my gallery'
    - Link shown on the gallery upload page that takes the member back to their gallery management page.
gallery.image.edit.page_title:
    - 'Edit photo'
    - Browser tab title suffix on the gallery image edit page (after the image title).
gallery.image.edit.back:
    - 'Back to gallery'
    - Link from the gallery image edit page to the gallery management page (/gallery/manage).
gallery.image.edit.view_full:
    - 'Open full size'
    - Link under the preview on the gallery image edit page to the legacy full image URL.
gallery.image.edit.save:
    - 'Save changes'
    - Primary submit button on the gallery image edit form.
gallery.upload_to_album:
    - 'Album (optional)'
    - Placeholder/label for the album selector in the upload tab of the gallery manage page.
gallery.album.delete.confirm:
    - 'Delete this album? Photos will not be deleted.'
    - Confirmation message shown in the modal when the member tries to delete an album.
gallery.photo.saving:
    - 'Saving…'
    - Label on the save button in the photo edit sheet while the AJAX request is in progress.
gallery.photo.saved:
    - 'Saved'
    - Label on the save button in the photo edit sheet after a successful save.
gallery.photo.deleting:
    - 'Deleting…'
    - Label on the delete button in the photo edit sheet while the delete request is in progress.
gallery.photo.sheet.description.placeholder:
    - 'Add a description…'
    - Placeholder text for the description textarea in the photo edit bottom sheet.
gallery.mine.title:
    - 'My photos'
    - Title of the page where a member manages their own photos and albums
gallery.mine.count:
    - '{count, plural, =0 {No photos yet} one {# photo} other {# photos}}'
    - My photos page, how many photos the member has
gallery.mine.add:
    - 'Add photos'
    - My photos page, button to choose photos to upload
gallery.mine.albums:
    - 'Albums'
    - My photos page, name of the row of album pills (for screen readers)
gallery.mine.all:
    - 'All'
    - My photos page, pill that shows all photos
gallery.mine.album.new:
    - 'New album'
    - My photos page, pill and choice to create an album
gallery.mine.album.name:
    - 'Album name'
    - My photos page, placeholder of the album name field
gallery.mine.album.create:
    - 'Create'
    - My photos page, button that creates the album
gallery.mine.album.rename:
    - 'Rename'
    - My photos page, button to give the album shown a new name
gallery.mine.album.delete:
    - 'Delete album'
    - My photos page, button to delete the album shown
gallery.mine.album.delete.confirm:
    - 'Delete this album? Its photos stay in My photos.'
    - My photos page, question before an album is deleted
gallery.mine.album.none:
    - 'No album'
    - My photos page, choice to take photos out of any album
gallery.mine.select:
    - 'Select'
    - My photos page, button to pick several photos
gallery.mine.selected:
    - '{count, plural, =0 {Pick photos} one {# selected} other {# selected}}'
    - My photos page, bottom bar, how many photos are picked
gallery.mine.move:
    - 'Move to album'
    - My photos page, bottom bar, list of albums to move the picked photos to
gallery.mine.delete:
    - 'Delete'
    - My photos page, button to delete a photo or the picked photos
gallery.mine.delete.one:
    - 'Delete this photo?'
    - My photos page, question before one photo is deleted
gallery.mine.delete.many:
    - '{count, plural, one {Delete this photo?} other {Delete these # photos?}}'
    - My photos page, question before the picked photos are deleted
gallery.mine.cancel:
    - 'Cancel'
    - My photos page, button to close a dialog or stop picking photos
gallery.mine.edit:
    - 'Photo'
    - My photos page, title of the panel of one photo
gallery.mine.field.title:
    - 'Title'
    - My photos page, photo panel, title field
gallery.mine.field.title.placeholder:
    - 'Where or what is it?'
    - My photos page, photo panel, placeholder of the title field
gallery.mine.field.description:
    - 'Description'
    - My photos page, photo panel, description field
gallery.mine.field.description.placeholder:
    - 'A few words about this photo'
    - My photos page, photo panel, placeholder of the description field
gallery.mine.field.album:
    - 'Album'
    - My photos page, photo panel, album choice
gallery.mine.save:
    - 'Save'
    - My photos page, photo panel and rename dialog, save button
gallery.mine.saved:
    - 'Saved'
    - My photos page, photo panel, shown on the button once saved
gallery.mine.empty.album:
    - 'This album is empty'
    - My photos page, title when the album shown has no photos
gallery.mine.empty.text:
    - 'Add photos of your home, your city or your travels. You can also drop them on this page.'
    - My photos page, text when there are no photos
gallery.mine.drop:
    - 'Drop your photos to add them'
    - My photos page, shown while photos are dragged over the page
gallery.mine.error.size:
    - 'This photo is too large'
    - My photos page, error on a photo that is too large to upload
gallery.mine.error.type:
    - 'Only JPEG, PNG or GIF'
    - My photos page, error on a file that is not a supported image
gallery.mine.error.failed:
    - 'Something went wrong. Please try again.'
    - My photos page, error when saving failed
gallery.mine.add.short:
    - 'Add'
    - My photos page, short button in the head to add photos
gallery.mine.done:
    - 'Done'
    - My photos page, button that stops picking photos
gallery.mine.album.options:
    - 'Album options'
    - My photos page, menu button of the album shown (for screen readers)
gallery.mine.album.new.short:
    - 'New'
    - My photos page, chip to create an album while choosing one
gallery.mine.move.short:
    - 'Move'
    - My photos page, bottom bar, button to move the picked photos to an album
gallery.mine.previous:
    - 'Previous photo'
    - My photos page, photo sheet, arrow to the previous photo (for screen readers)
gallery.mine.next:
    - 'Next photo'
    - My photos page, photo sheet, arrow to the next photo (for screen readers)
