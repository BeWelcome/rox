group.got.invited.by:
    - 'Invited by group admin {admin}.'
    - Text added to the why I've joined when a user accepts an invitation to a group
group.approved.join:
    - 'Your request to join the group {group} has been approved'
    - Subject of the approval notification to join a group
group.declined.join:
    - 'Your request to join the group {group} has been declined'
    - Subject of the declination notification to join a group
group.invitation.accepted:
    - 'Your invitation to join the group {group} has been accepted'
    - Subject of the notification that a group invitation has been accepted
group.invitation.declined:
    - 'Your invitation to join the group {group} has been declined'
    - Subject of the notification that a group invitation has been declined
group.admin.approved:
    - 'Your request to join the {group} has been approved by {admin}.'
    - Text in the email notification if a request to join a group is accepted.
flash.group.invite.withdrawn:
    - 'You withdrew the invitation to this group.'
    - Flash shown when an invitation to a group is removed.
flash.group.invite.withdrawn.error:
    - 'There was an error when trying to withdraw the invitation to this group. Please inform the dev team.'
    - Error message shown as flash message.
flash.group.delete.error:
    - 'The group could not be deleted.'
    - Error message shown when deleting a group fails.
group.picture.missing:
    - 'Please select a picture for the group.'
    - Error message shown under the picture field when a new group is created without a picture.
    - validators
group.declined.invitation:
    - '{username} has declined the invitation to the {group} group.'
    - Mail to the admins of a group when a member declines the invitation to the group.
admin.groups.categories:
    - 'Categories'
    - Item in the menu of the group admin pages and heading of the page that lists the categories groups can be put in
admin.group.category.groups:
    - 'Groups'
    - Column heading on the group categories admin page; the number of groups in a category
admin.group.category.name.help:
    - 'An empty name removes the language. The English name is required.'
    - Help below the name field when a group admin sets the name of a group category in a language
admin.group.category.english:
    - 'A category needs an English name.'
    - Error when a group admin tries to remove the English name of a group category
admin.group.category.saved:
    - 'The category is saved.'
    - Message after a group admin added a group category or changed one of its names
admin.group.category.deleted:
    - 'The category is deleted.'
    - Message after a group admin deleted a group category
group.search.category:
    - 'Category'
    - Label of the category filter on the group search page
group.search.category.all:
    - 'All categories'
    - First choice of the category filter on the group search page (no filter)
group.search.no.results:
    - 'No groups found.'
    - Shown on the group search page when no group matches the search
group.membership.notifications:
    - 'Notify me about new posts in the group''s forum'
    - Checkbox in a member's settings for a group they're in
group.member.banned:
    - 'The member is banned from the group.'
    - Message after a group admin banned a member from the group
group.member.ban.failed:
    - 'The member could not be banned. Admins of the group, BeWelcome admins and forum moderators can''t be banned.'
    - Error when a group admin couldn't ban a member from the group
group.admin.add.failed:
    - 'The member could not be made an admin of the group.'
    - Error when a group admin couldn't promote a member to admin
group.admin.resign:
    - 'Step down as admin'
    - Button on a group's page for its admins; the last admin of a group can't step down
group.profile.groups:
    - 'Groups on my profile'
    - On the "my groups" page; opens the list of the member's groups to tick the ones their profile shows
group.profile.groups.saved:
    - 'Your profile shows the groups you picked.'
    - Message after a member chose which of their groups their profile shows
group.profile.shown:
    - 'Show this group on my profile'
    - Checkbox in a member's settings for a group they are in
group.list.title:
    - 'Groups'
    - Title of the groups pages (my groups, all groups)
group.list.create:
    - 'Create group'
    - Groups pages, button at the top right that starts a new group
group.list.create.short:
    - 'Create'
    - Groups pages on phones, the same button as group.list.create with less room
group.list.search:
    - 'Search groups by name'
    - Groups pages, grey text in the empty search field
group.list.mine:
    - 'My groups'
    - Groups pages, tab with the groups the member is in; the number of them follows
group.list.all:
    - 'All groups'
    - Groups pages, tab with every group; the number of them follows
group.list.order.actdesc:
    - 'Last post'
    - Groups pages, order of the list, the group with the newest post first
group.list.order.nameasc:
    - 'Name'
    - Groups pages, order of the list, by name from A to Z
group.list.order.membersdesc:
    - 'Members'
    - Groups pages, order of the list, the biggest group first
group.list.order.createddesc:
    - 'Newest'
    - Groups pages, order of the list, the newest group first
group.list.members:
    - '{count, plural, one {# member} other {# members}}'
    - Groups pages, on each group, how many members it has
group.list.active.today:
    - 'Active today'
    - Groups pages, on a group with a post today
group.list.active.yesterday:
    - 'Active yesterday'
    - Groups pages, on a group with a post yesterday
group.list.last.post:
    - 'Last post {date}'
    - Groups pages, on a group, the day of its newest post (Last post Oct 17)
group.list.joined:
    - 'Joined'
    - Groups pages, on a group the member is in
group.profile.groups.hint:
    - 'Pick the groups people see on your profile.'
    - On the my groups page, under group.profile.groups, above a switch for each of the member's groups
group.list.place.placeholder:
    - 'Type a city, region or country'
    - Groups pages, grey text in the place field; picking a suggestion searches at once
