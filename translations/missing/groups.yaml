group.list.active.yesterday:
    - 'Active yesterday'
    - Groups pages, on a group with a post yesterday
group.list.last.post:
    - 'Last post {date}'
    - Groups pages, on a group, the day of its newest post (Last post Oct 17)
group.list.joined:
    - 'Joined'
    - Groups pages, on a group the member is in
group.profile.groups.hint:
    - 'Pick the groups people see on your profile.'
    - On the my groups page, under group.profile.groups, above a switch for each of the member's groups
group.list.place.placeholder:
    - 'Type a city, region or country'
