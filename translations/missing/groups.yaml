group.list.active.years:
    - 'Active {count, plural, one {# year} other {# years}} ago'
    - Groups pages, on a group whose newest post is a year old or more
group.official:
    - Official
    - Badge next to the name of the BeWelcome Agora (the group of the whole community).
group.agora.open:
    - Open
    - Button on the BeWelcome Agora's card above the group lists, leads to it.
