    - 'Your profile shows the groups you picked.'
    - Message after a member chose which of their groups their profile shows
group.profile.shown:
    - 'Show this group on my profile'
    - Checkbox in a member's settings for a group they are in
group.list.title:
    - 'Groups'
    - Title of the groups pages (my groups, all groups)
group.list.create:
    - 'Create group'
    - Groups pages, button at the top right that starts a new group
group.list.create.short:
    - 'Create'
    - Groups pages on phones, the same button as group.list.create with less room
group.list.search:
    - 'Search groups by name'
    - Groups pages, grey text in the empty search field
group.list.mine:
    - 'My groups'
    - Groups pages, tab with the groups the member is in; the number of them follows
group.list.all:
    - 'All groups'
