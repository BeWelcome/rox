    - The newest topic of the BeWelcome Agora on its card above the group lists. Keep {title} as it is.
group.near.eyebrow:
    - Near you
    - Small heading above the groups near the member's place on the groups page.
group.near.title:
    - 'Groups around {place}'
    - Title of the groups near the member's place (their city, region or country). Keep {place} as it is.
group.near.see.all:
    - 'See all {count} in {country}'
    - Link to all groups in the member's country. Keep {count} and {country} as they are.
group.categories.eyebrow:
    - Browse
    - Small heading above the group categories on the groups page.
group.categories.title:
