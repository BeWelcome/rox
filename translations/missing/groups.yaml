    - Subscriptions
    - Tab of the groups page with the topics the member follows and the groups whose posts they get by mail.
group.list.subscriptions.new:
    - '{count} new'
    - Count on the Subscriptions tab of the groups page, topics with posts the member hasn't seen. Keep {count} as it is.
group.subscriptions.topics:
