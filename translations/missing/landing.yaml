landing.tab.visitors:
    - 'Visitors'
    - Tab header for the list of visitors to your area on the landing page
trip.posted.by:
    - 'posted by {username}'
    - shows who posted the trip as part of the item on the landing page. Make sure to keep the {username} part intact.

landing.search.placeholder:
    - 'Search a city, a region...'
    - Placeholder of the search field in the welcome banner of the home page, under "Where are you going?"

landing.viewprofile:
    - 'View my profile'
    - Link to the member's own profile, next to their city in the welcome banner of the home page
landing.search.mode.place:
    - 'Place'
    - Switch in the welcome banner of the home page to search around a place
landing.search.mode.member:
    - 'Member'
    - Switch in the welcome banner of the home page to search a member by username
landing.search.findmember:
    - 'Find a member'
    - Title of the member search in the welcome banner of the home page
landing.search.member.placeholder:
    - 'Type a username...'
    - Placeholder of the member search field in the welcome banner of the home page
landing.search.place.hint:
    - 'Find hosts, travelers and activities around a place.'
    - Hint under the place search field in the welcome banner of the home page
landing.search.member.hint:
    - 'Start typing and pick a match from the list.'
    - Hint under the member search field in the welcome banner of the home page
landing.search.submit:
    - 'Search'
    - Button of the search field in the welcome banner of the home page
landing.stats.requests:
    - 'stay requests to answer'
    - Shown after a number in the welcome banner of the home page, e.g. "4 stay requests to answer"
landing.stats.travelers:
    - 'travelers coming to {city}'
    - Shown after a number in the welcome banner of the home page, e.g. "5 travelers coming to Barcelona". Keep {city} intact.
landing.stats.travelers.area:
    - 'travelers coming to your area'
    - Shown after a number in the welcome banner of the home page when the member has no city set
landing.stats.activities:
    - 'upcoming activities'
    - Shown after a number in the welcome banner of the home page, e.g. "3 upcoming activities"
landing.stats.trip:
    - 'Plan a public trip'
    - Highlighted link in the welcome banner of the home page that opens the form to create a trip
landing.stats.trip.hint:
    - 'Let hosts know you are coming'
    - Small line under "Plan a public trip" in the welcome banner of the home page
landing.stats.trip.short:
    - 'Create a public trip'
    - Highlighted link to create a trip in the welcome banner of the home page, on small screens
landing.viewprofile.short:
    - 'My profile'
    - Short link to the member's own profile in the welcome banner of the home page, on small screens
landing.stats.requests.short:
    - 'requests to answer'
    - Short label under a number in the welcome banner of the home page, on small screens
landing.stats.travelers.short:
    - 'travelers coming'
    - Short label under a number in the welcome banner of the home page, on small screens
landing.stats.activities.short:
    - 'activities'
    - Short label under a number in the welcome banner of the home page, on small screens
landing.search.member.searching:
    - 'Searching...'
    - Shown with a loader in the member suggestions of the welcome banner of the home page while the search runs
landing.hosting.switch:
    - 'I can host travelers'
    - Label of the hosting switch in the welcome banner of the home page, on small screens
landing.banner.collapse:
    - 'Show less'
    - Button that folds the welcome banner of the home page down to the member line, on small screens
landing.banner.expand:
    - 'Show more'
    - Button that unfolds the welcome banner of the home page (hosting switch, search and counters), on small screens
landing.beinformed.previous:
    - 'Previous links'
    - Button that shows the previous page of links in the "Be informed" box of the home page
landing.beinformed.next:
    - 'Next links'
    - Button that shows the next page of links in the "Be informed" box of the home page
landing.tab.today:
    - 'Threads with a new post today'
    - Tooltip of the count next to the My groups tab on the home page
landing.groups.empty:
    - 'No discussions in your groups yet.'
    - Shown in the My groups tab of the home page when the member's groups have no thread
landing.see.all:
    - 'See all'
    - Button under the Forum, My groups and Activities lists on the home page, opens the full list
landing.thread.replies:
    - '{count} replies'
    - Tooltip of the replies count on the right of a forum or group thread on the home page. Keep {count} intact.
landing.activities.online:
    - 'Show online'
    - Short switch label above the activities on the home page, shows the online activities too. Keep it short, it shares a line with Create activity on phones.
landing.dash.messages:
    - 'Messages'
    - 'Home page: title of the messages card'
landing.dash.coming.to:
    - 'Coming to {city}'
    - 'Home page: title of the card of members travelling to the member''s city. Keep {city}'
landing.dash.see.trip:
    - 'See trip'
    - 'Home page, trips card: link that opens the trip'
landing.dash.activities:
    - 'Upcoming activities'
    - 'Home page: title of the activities card'
landing.dash.activities.all:
    - 'All activities'
    - 'Home page: link at the bottom of the activities card'
landing.dash.groups:
    - 'Group discussions'
    - 'Home page: title of the card with the discussions of the member''s groups'
landing.dash.groups.all:
    - 'All discussions'
    - 'Home page: link at the bottom of the group discussions card'
landing.dash.activities.none:
    - 'No activities nearby'
    - 'Home page, activities card: there is no upcoming activity near the member'
landing.dash.activities.create:
    - 'Create one'
    - 'Home page, activities card: link to create an activity when there is none'
landing.search.where:
    - 'Where are you going?'
    - 'Home page: placeholder of the place search in the welcome banner'
landing.alert.requests:
    - '{count, plural, one {# stay request} other {# stay requests}}'
    - 'Home page: start of the line under the welcome banner when requests wait for an answer (in bold). Keep the # sign'
landing.alert.waiting:
    - 'waiting for your answer'
    - 'Home page: end of the line under the welcome banner, after the number of stay requests'
landing.alert.answer:
    - 'Answer'
    - 'Home page: link on the right of the line about stay requests waiting for an answer'
landing.search.dates.known:
    - 'Already know your dates?'
    - 'Home page: text under the place search, before the link to plan a public trip'
landing.plan.public.trip:
    - 'Plan a public trip'
    - 'Home page: link under the place search that opens the form to create a trip'
landing.plan.public.trip.hint:
    - "hosts will see you're coming"
    - 'Home page: grey text after the link to plan a public trip'
landing.search.by.username:
    - 'Search by username'
    - 'Home page: help under the member search'
landing.alert.to.answer:
    - 'to answer'
    - 'Home page on phones: end of the line about stay requests, after the number of requests'
landing.dash.waiting.you:
    - 'Waiting for you'
    - 'Home page, Messages card: small label on a stay request or invitation the member still has to answer'
