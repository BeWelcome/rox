mydata.activities.no.activity:
    - 'No activities found.'
    - Information when a user has not attended nor created any activities.
mydata.activity.maybe.attend:
    - 'You said ›I might attend this activity‹.'
    - Information about the attendance for an activity.
mydata.comments.no.comment:
    - 'No comments found.'
    - Information when a user has not left any comments.
mydata.communitynews.no.comments:
    - 'No comments found.'
    - Information when a user has not left any comments for a communitynews.
mydata.communitynews.no.communitynews:
    - 'You did not create any community news.'
    - Information when a user has not created any communitynews.
mydata.gallery.no.images:
    - 'Your gallery is empty.'
    - Information when a user has not uploaded any image to the gallery.
mydata.logs.no.logs:
    - 'Oddly there are no logs about your ways on BeWelcome.'
    - Should never be shown to anyone.
mydata.pictures.no.images:
    - 'You never uploaded any profile pictures.'
    - Shown to the user if their profile still shows a beaver :)
mydata.polls.contributed.no.polls:
    - 'You never took part in any poll.'
    - Shown to the user, who never contributed in a poll (most of the members).
mydata.polls.created.no.polls:
    - 'You never created a poll.'
    - Shown to the user, who never created a poll (nearly all of the members).
mydata.polls.voted.no.polls:
    - 'You never took part in any poll.'
    - Shown to the user, who never voted in a poll (most of the members). (Same as mydata.polls.contributed.no.polls)
mydata.posts.no.posts:
    - 'You never posted into a group or the forum.'
    - Text in the posts section of the extracted data if no posts have been found.
mydata.privileges.no.privileges:
    - 'You do not have any additional privileges (regular user, not volunteering).'
    - Shown if the user does not have additional privileges (like group owner).
mydata.relations.no.comments:
    - 'You have no special relations.'
    - Text in the special relations section (family and friends) of the extracted data if no relations have been found.
mydata.requests.no.requests:
    - 'You have not gotten or written any request.'
    - Text in the requests section of the extracted data if no requests have been found.
mydata.rights.no.rights:
    - 'You do not have any additional rights (regular user, not volunteering).'
    - Shown if the user does not have additional rights (like translation rights).
mydata.subscriptions.thread.name:
    - Thread Name
    - Table header for the listed threads with their subscriptions
mydata.subscriptions.subscription:
    - Subscriptions
    - Table header for the listed threads with their subscriptions
mydata.subscriptions.threads.headline:
    - Thread Subscriptions
    - Headline for the list of subscribed threads
mydata.subscriptions.threads.abstract:
    - 'This lists all thread subscriptions you have active.'
    - Abstract for the subscription section (see /forums/subscriptions).
mydata.subscriptions.threads.no.subscriptions:
    - 'You did not subscribe to any posts or threads in the forum or to any group.'
    - Text in the subscriptions section of the extracted data if no subscriptionss have been found.
mydata.subscriptions.no.subscriptions:
    - 'You did not subscribe to any posts or threads in the forum or to any group.'
    - Text in the subscriptions section of the extracted data if no subscriptionss have been found.
mydata.trips.headline:
    - 'Trips'
    - Headline for the extracted data about trips created by the user.
mydata.trips.abstract:
    - 'This lists all trips you created.'
    - Short paragraph giving an explaining for the trips section of the extracted data.
mydata.trips.no.trips:
    - 'You have not created any trip.'
    - Text in the trips section of the extracted data.
mydata.polls.choices:
    - 'Options for this poll'
    - Text shown in the extracted data for the options offered for a poll
mydata.polls.groups:
    - 'Groups involved'
    - This is shown if the poll is limited to a group
mydata.browser.push.subscriptions.headline:
    - Browser notification subscriptions
    - Headline for browser push subscriptions in the personal data export.
mydata.browser.push.subscriptions.abstract:
    - This lists safe metadata for browser notification subscriptions connected to your account.
    - Short paragraph explaining browser push metadata in the personal data export.
mydata.browser.push.subscriptions.no.subscriptions:
    - You do not have any browser notification subscriptions.
    - Text in the browser push subscriptions section when no subscriptions were found.
mydata.browser.push.subscriptions.endpoint.hash:
    - Endpoint hash
    - Table header for the hashed browser push endpoint.
mydata.browser.push.subscriptions.endpoint.host:
    - Endpoint host
    - Table header for the browser push endpoint host.
mydata.browser.push.subscriptions.user.agent:
    - Browser
    - Table header for the browser user agent stored with a push subscription.
mydata.browser.push.subscriptions.content.encoding:
    - Content encoding
    - Table header for the push subscription content encoding.
mydata.browser.push.subscriptions.created:
    - Created
    - Table header for when a browser push subscription was created.
mydata.browser.push.subscriptions.last.seen:
    - Last seen
    - Table header for when a browser push subscription was last refreshed.
mydata.browser.push.subscriptions.last.error:
    - Last error
    - Table header for the last push delivery error for a browser subscription.
mydata.browser.push.notifications.headline:
    - Queued browser notifications
    - Headline for queued browser push notifications in the personal data export.
mydata.browser.push.notifications.abstract:
    - This lists queued browser notification metadata connected to your account.
    - Short paragraph explaining queued browser push notification metadata in the personal data export.
mydata.browser.push.notifications.no.notifications:
    - You do not have any queued browser notifications.
    - Text in the browser push notifications section when no queued notifications were found.
mydata.browser.push.notifications.type:
    - Type
    - Table header for the browser push notification type.
mydata.browser.push.notifications.sender:
    - Sender
    - Table header for the browser push notification sender username.
mydata.browser.push.notifications.url:
    - URL
    - Table header for the browser push notification target URL.
mydata.browser.push.notifications.status:
    - Status
    - Table header for the browser push notification queue status.
mydata.browser.push.notifications.created:
    - Created
    - Table header for when a browser push notification queue row was created.
mydata.browser.push.notifications.updated:
    - Updated
    - Table header for when a browser push notification queue row was updated.
mydata.browser.push.notifications.last.error:
    - Last error
    - Table header for the last browser push notification queue error.
