profile.preferences:
    - 'Preferences'
    - Headline on the preferences page
itemsperpage:
    - 'Items shown per page'
    - 'Section header of the preferences that is used to allow users to have longer pages'
preferenceitemsperpagedesc:
    - 'The number you select here is used on all pages that offer pagination to reduce the amount of data loaded
       by the server in a single go.'
    - 'Help text for the preference ''Items shown per page'''
itemsperpage5:
    - '5'
    - Used in the preference drop down for items per page
    - messages+intl-icu
    - yes
itemsperpage10:
    - '10'
    - Used in the preference drop down for items per page
    - messages+intl-icu
    - yes
itemsperpage20:
    - '20'
    - Used in the preference drop down for items per page
    - messages+intl-icu
    - yes
itemsperpage50:
    - '50'
    - Used in the preference drop down for items per page
    - messages+intl-icu
    - yes
itemsperpage100:
    - '100'
    - Used in the preference drop down for items per page
    - messages+intl-icu
    - yes
allowrequestsnopicture:
    - Accept requests or invitations from members without a profile picture
    - Description on the preference page
allowrequestsnoaboutme:
    - Accept requests or invitations from members without a 'About me' section filled in
    - Description on the preference page
allowrequestsnopictureno:
    - '@no'
allowrequestsnopictureyes:
    - '@yes'
allowrequestsnoaboutmeno:
    - '@no'
allowrequestsnoaboutmeyes:
    - '@yes'
preference.allow.no.picture:
    - If set to 'No' you will only get requests or invitations from members who've uploaded a profile picture.
    - Description on the preference page
preference.allow.no.about_me:
    - If set to 'No' you will only get requests or invitations from members who've written something about themselves (in about me).
    - Description on the preference page
preferencebrowsernotifications:
    - Browser notifications
    - Section header for the preference that allows members to receive browser push notifications
browsernotificationsdesc:
    - Choose whether BeWelcome should send browser notifications for new messages, hosting requests, invitations, and subscribed forum threads. On iPhone and iPad, first add BeWelcome to your Home Screen.
    - Help text for the preference Browser notifications
preferencebrowsernotificationsno:
    - "No"
preferencebrowsernotificationsopenonly:
    - Only when BeWelcome is open
    - Browser notifications preference option
preferencebrowsernotificationsalways:
    - Always
    - Browser notifications preference option
browser.notifications.device.enable:
    - Enable or retry on this browser
    - Button for enabling Web Push on the current browser.
browser.notifications.device.active:
    - Notifications are enabled on this browser.
browser.notifications.device.inactive:
    - Notifications are not yet enabled on this browser.
browser.notifications.device.open_only:
    - Notifications will appear only while this tab is open.
browser.notifications.device.off:
    - Browser notifications are off.
browser.notifications.device.denied:
    - Notifications are blocked in this browser's site settings.
browser.notifications.device.unsupported:
    - Web Push is not available here. On iPhone and iPad, add BeWelcome to your Home Screen first.
browser.notifications.device.error:
    - Notifications could not be enabled. Please try again.
tripsnotifications:
    - Trip notifications
    - Label on the preferences page for trip notifications.
trips.notifications:
    - Choose whether to be notified when members add trips in your area.
    - Help text on the preferences page for trip notifications.
tripsnotificationsnever:
    - Never
    - Option on the preferences page for trip notifications.
tripsnotificationsimmediately:
    - Immediately
    - Option on the preferences page for trip notifications.
tripsnotificationsdaily:
    - Daily
    - Option on the preferences page for trip notifications.
tripsnotificationsweekly:
    - Weekly
    - Option on the preferences page for trip notifications.
tripsnotificationsmonthly:
    - Monthly
    - Option on the preferences page for trip notifications.
