suggest.refine:
    - 'Refine your search'
    - Headline for the section of the search results if there are more than 20 hits
suggest.more.results:
    - 'More than 20 results please refine your search'
    - Shown if the search parameters aren't limiting enough.
suggest.locations.none:
    - 'No place found for "{term}"'
    - Place search fields (setup, trips, groups, search), the list when no place matches what was typed. Keep {term}.
suggest.locations.failed:
    - 'The place search is not available right now. Please try again in a moment.'
    - Place search fields, the list when the search failed (for example while the search index is rebuilt).
